<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pokémon Wildfront</title>
    <meta name="description" content="Unofficial, free fan-made Pokémon tactical RPG for the browser." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8ecf4' stroke='%2310141c' stroke-width='3'/%3E%3Cpath d='M2 16a14 14 0 0 1 28 0z' fill='%23d0021b' stroke='%2310141c' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23e8ecf4' stroke='%2310141c' stroke-width='3'/%3E%3C/svg%3E" />
    <meta name="theme-color" content="#10141c" />
    <meta property="og:title" content="Pokémon Wildfront" />
    <meta property="og:description" content="Unofficial, free fan-made Pokémon tactical RPG for the browser." />
    <meta property="og:type" content="website" />
    <style>
      :root { --bg: #10141c; --fg: #e8ecf4; --dim: #8a93a6; color-scheme: dark; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
      #game { width: 100%; height: 100%; touch-action: none; }
      /* Shown by the browser before any game code runs; removed once the game has booted. */
      #loading {
        position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; gap: 14px;
        align-items: center; justify-content: center; background: var(--bg); font: 15px/1.4 monospace; text-align: center;
        padding: 0 max(16px, env(safe-area-inset-left, 0px));
      }
      #loading h1 { margin: 0; font-size: 34px; color: #f5d76e; font-weight: normal; }
      #loading .ball {
        width: 36px; height: 36px; border-radius: 50%; border: 3px solid #10141c; box-shadow: 0 0 0 2px #e8ecf4;
        background: linear-gradient(#d0021b 0 46%, #10141c 46% 54%, #e8ecf4 54%);
        animation: wobble 1.1s ease-in-out infinite;
      }
      @keyframes wobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-18deg); } 75% { transform: rotate(18deg); } }
      @media (prefers-reduced-motion: reduce) { #loading .ball { animation: none; } }
      #loading small { color: var(--dim); max-width: 520px; }
      /* The game is landscape-only; on a phone held upright, ask to rotate. */
      #rotate { display: none; }
      @media (orientation: portrait) and (max-width: 760px) {
        #rotate {
          display: flex; position: fixed; inset: 0; z-index: 10; flex-direction: column; gap: 12px;
          align-items: center; justify-content: center; text-align: center; background: var(--bg);
          font: 16px/1.4 monospace; padding: 0 max(16px, env(safe-area-inset-left, 0px));
        }
        #rotate small { color: var(--dim); }
        #rotate button {
          font: 15px monospace; color: var(--fg); background: #2a3245; border: 1px solid #5a6785;
          padding: 10px 16px; margin-top: 8px; cursor: pointer;
        }
        /* Rotated mode: the game is drawn sideways, so a phone with auto-rotate off can be held in landscape. */
        body.rotated #rotate { display: none; }
        body.rotated #game {
          position: fixed; top: 0; left: 100vw; width: 100vh; height: 100vw;
          transform-origin: top left; transform: rotate(90deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading" role="status" aria-live="polite">
      <div class="ball"></div>
      <h1>Pokémon Wildfront</h1>
      <span>Loading the game…</span>
      <small>Unofficial fan game. Not affiliated with or endorsed by Nintendo, Game Freak, Creatures Inc. or The Pokémon Company.</small>
    </div>
    <div id="rotate"><span style="font-size: 40px">⟳</span><span>Turn your phone sideways to play.</span><small>Pokémon Wildfront is played in landscape.</small><button id="play-rotated" type="button">Auto-rotate is off? Play sideways anyway</button></div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
