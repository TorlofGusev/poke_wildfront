<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pokémon Wildfront</title>
    <meta name="description" content="Unofficial, free fan-made Pokémon tactical RPG prototype for the browser." />
    <style>
      :root { --bg: #10141c; --fg: #e8ecf4; --dim: #8a93a6; color-scheme: dark; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
      #game { width: 100%; height: 100%; touch-action: none; }
      /* The game is landscape-only; on a phone held upright, ask to rotate. */
      #rotate { display: none; }
      @media (orientation: portrait) and (max-width: 760px) {
        #rotate {
          display: flex; position: fixed; inset: 0; z-index: 10; flex-direction: column; gap: 12px;
          align-items: center; justify-content: center; text-align: center; background: var(--bg);
          font: 16px/1.4 monospace; padding: 0 max(16px, env(safe-area-inset-left, 0px));
        }
        #rotate small { color: var(--dim); }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><span style="font-size: 40px">⟳</span><span>Turn your phone sideways to play.</span><small>Pokémon Wildfront is played in landscape.</small></div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
